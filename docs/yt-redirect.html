<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vett — YouTube Auth</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0a0c10;color:#e6edf3;font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
.wrap{max-width:560px;padding:24px}
h1{color:#33e1b0}
code{display:block;background:#12161c;border:1px solid #1e252e;border-radius:10px;padding:16px;
  margin:16px 0;word-break:break-all;color:#40d678;font-size:14px}
button{background:#33e1b0;color:#04150f;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
.dim{color:#8b98a5;font-size:14px}
</style></head>
<body><div class="wrap">
<h1>YouTube authorization</h1>
<p>Copy the code below and paste it back to Claude to finish connecting the channel.</p>
<code id="code">No code found in the URL.</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy code</button>
<p class="dim">You can close this tab after copying.</p>
<script>
  const p = new URLSearchParams(location.search);
  const c = p.get('code');
  if (c) document.getElementById('code').textContent = c;
  else if (p.get('error')) document.getElementById('code').textContent = 'Error: ' + p.get('error');
</script>
</div></body></html>
